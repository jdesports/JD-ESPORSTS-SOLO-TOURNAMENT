<style>
  :root{
    --bg:#0a0510; --card:#171022; --orange:#ff2fa0; --red:#9b30ff;
    --text:#f2f2f7; --muted:#9a9ab0; --green:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at top,#3a0a2e 0%,var(--bg) 55%) fixed;
    color:var(--text);line-height:1.5;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}

  /* Header */
  header{padding:28px 0 8px;text-align:center}
  .logo{height:150px;width:150px;object-fit:cover;border-radius:50%;box-shadow:0 0 30px rgba(255,47,160,.6)}
  .brand{margin-top:8px;font-size:1.1rem;letter-spacing:4px;color:var(--orange);font-weight:700}

  /* Hero */
  .hero{text-align:center;padding:24px 0 8px}
  .hero h1{font-size:clamp(2rem,8vw,3.6rem);line-height:1.1;font-weight:900;text-transform:uppercase}
  .hero h1 span{background:linear-gradient(90deg,var(--orange),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);margin-top:10px}

  .btn{
    display:inline-block;margin-top:22px;padding:16px 38px;border-radius:50px;
    background:linear-gradient(90deg,var(--orange),var(--red));color:#fff;
    font-size:1.1rem;font-weight:800;text-decoration:none;text-transform:uppercase;
    letter-spacing:1px;box-shadow:0 8px 28px rgba(255,47,160,.45);
    transition:transform .15s;
  }
  .btn:hover{transform:translateY(-2px) scale(1.03)}
  .btn.disabled{background:#444;box-shadow:none;pointer-events:none;color:#aaa}

  /* Cards */
  section{margin:34px 0}
  h2{font-size:1.4rem;margin-bottom:14px;text-transform:uppercase;letter-spacing:1px}
  h2::after{content:"";display:block;width:50px;height:3px;background:var(--orange);margin-top:6px;border-radius:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid #26263a;border-radius:14px;padding:16px;text-align:center}
  .card .label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
  .card .value{font-size:1.4rem;font-weight:800;margin-top:4px}

  /* Slots */
  .stats .value.reg{color:var(--green)}
  .stats .value.rem{color:var(--orange)}
  .bar{height:14px;background:#26263a;border-radius:10px;overflow:hidden;margin:16px 0 6px}
  .bar div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--red));transition:width .8s}
  .barlabel{text-align:right;color:var(--muted);font-size:.85rem}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:16px}
  .slot{background:var(--card);border:1px dashed #333350;border-radius:10px;padding:8px 10px;font-size:.85rem;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot.taken{border:1px solid var(--green);border-style:solid;color:#fff}
  .slot b{color:var(--muted);margin-right:6px}

  /* Rules */
  ul.rules{list-style:none}
  ul.rules li{background:var(--card);border-left:3px solid var(--orange);padding:10px 14px;margin-bottom:8px;border-radius:8px}

  .center{text-align:center}
  footer{text-align:center;color:var(--muted);padding:30px 0 40px;font-size:.85rem;border-top:1px solid #1f1f30;margin-top:40px}
</style>
</head>

<script>
/* =====================================================
   EDIT ONLY THIS SECTION TO UPDATE YOUR WEBSITE
   ===================================================== */

// 1. Your WhatsApp link (group invite link OR https://wa.me/91XXXXXXXXXX?text=...)
const WHATSAPP_LINK = "https://wa.me/918217816606?text=Hi%20JD%20Esports%2C%20I%20want%20to%20register%20for%20the%20Free%20Fire%20MAX%20tournament";

// 2. Total slots
const TOTAL_SLOTS = 48;

// 3. REGISTERED PLAYERS - add each name inside quotes, separated by commas.
//    The registered / remaining count updates automatically.
//    Example: ["JD Rahul", "Ninja X", "Sky Gamer"]
const PLAYERS = [
  "Royal राजपूत",
  "Ꭺʀʀᴏᴡㅤ→",
  "MR X. LIVE",
  "TQG.KAIZEN07",
  "OFLﾠHITESH",
  "TG MAFIA",
  "RizzyTheOG",
  "TOX1C",
  "mahendraaa7",
  "Mvp speedy",
  "Bewafa",
  "༒VIKASH-KinG",
  "GP.J1NW00",
  "ABHIMANYU1",
  "7h aura",
  "Agent?ITACHI",
  ".Rock yt.",
  "GXL ISAGI",
  "ANISH HERE",
  " NFL Rakesh",
  "GXL GALAXY",
  "AG AM4R  !!" ,
];

// 4. Tournament details (change the values)
const DETAILS = [
  { label: "Game",        value: "Free Fire MAX" },
  { label: "Date",        value: "SOON AFTER REGISTRATION" },
  { label: "Time",        value: "7:00 PM IST" },
  { label: "Mode",        value: "Solo" },
  { label: "Entry Fee",   value: "Free" },
  { label: "Prize Pool",  value: "Rs. 200" },
  { label: "1st Prize",   value: "Rs. 100" },
  { label: "2nd Prize",   value: "Rs. 60" },
  { label: "3rd Prize",   value: "Rs. 40" }
];

// 5. Rules (add or remove lines)
const RULES = [
  "Registration is only through WhatsApp.",
  "Slots are filled on a first come, first served basis.",
  "Hackers / cheaters will be disqualified immediately.",
  "Join the room on time. Late players will not be allowed.",
  "Admin's decision is final."
];

/* =====================================================
   DO NOT EDIT BELOW THIS LINE
   ===================================================== */
const registered = PLAYERS.length;
const remaining  = Math.max(TOTAL_SLOTS - registered, 0);
const percent    = Math.min((registered / TOTAL_SLOTS) * 100, 100);

document.getElementById("total").textContent      = TOTAL_SLOTS;
document.getElementById("totalText").textContent  = TOTAL_SLOTS;
document.getElementById("registered").textContent = registered;
document.getElementById("remaining").textContent  = remaining;
document.getElementById("barText").textContent    = registered + " / " + TOTAL_SLOTS + " slots filled";
setTimeout(() => document.getElementById("barFill").style.width = percent + "%", 200);

// Slot grid
const list = document.getElementById("slotList");
for (let i = 0; i < TOTAL_SLOTS; i++) {
  const d = document.createElement("div");
  const taken = i < registered;
  d.className = "slot" + (taken ? " taken" : "");
  const num = document.createElement("b");
  num.textContent = (i + 1) + ".";
  d.appendChild(num);
  d.appendChild(document.createTextNode(taken ? PLAYERS[i] : "Open"));
  list.appendChild(d);
}

// Register buttons
["registerBtn", "registerBtn2"].forEach(id => {
  const b = document.getElementById(id);
  if (remaining === 0) {
    b.textContent = "Slots Full";
    b.classList.add("disabled");
    b.removeAttribute("href");
  } else {
    b.href = WHATSAPP_LINK;
  }
});

// Details
const dBox = document.getElementById("details");
DETAILS.forEach(x => {
  const c = document.createElement("div");
  c.className = "card";
  const l = document.createElement("div"); l.className = "label"; l.textContent = x.label;
  const v = document.createElement("div"); v.className = "value"; v.textContent = x.value;
  c.append(l, v);
  dBox.appendChild(c);
});

// Rules
const rBox = document.getElementById("rules");
RULES.forEach(t => {
  const li = document.createElement("li");
  li.textContent = t;
  rBox.appendChild(li);
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>
